name: KnowledgeBase CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  backend-build:
    name: 后端构建
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 还原依赖
        run: dotnet restore KnowledgeBase.slnx

      - name: 构建后端
        run: dotnet build KnowledgeBase.slnx --configuration Release --no-restore

  frontend-build:
    name: 前端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装前端依赖
        run: npm install --no-audit --no-fund

      - name: TypeScript 与生产构建校验
        run: npm run build
