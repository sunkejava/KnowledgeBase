services:
  api:
    build:
      context: ./backend
      dockerfile: KnowledgeBase.Api/Dockerfile
    ports:
      - "5000:8080"
    volumes:
      - kb-data:/app/data
  web:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    depends_on:
      - api
volumes:
  kb-data:
